name: Download file and attach to release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"

      url:
        description: "URL of the file to download"
        required: true
        default: "https://getmonero.org/downloads/hashes.txt"

      file_name:
        description: "Name of the release asset"
        required: true
        default: "hashes.txt"

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download file
        shell: bash
        env:
          DOWNLOAD_URL: ${{ inputs.url }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail

          # Keep the asset in the workspace and avoid unexpected path behavior.
          FILE_PATH="${GITHUB_WORKSPACE}/${FILE_NAME}"

          echo "Downloading ${DOWNLOAD_URL} to ${FILE_PATH}"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            "${DOWNLOAD_URL}" \
            --output "${FILE_PATH}"

          test -s "${FILE_PATH}"
          ls -lh "${FILE_PATH}"
          echo "Downloaded ${FILE_PATH}"

      - name: Create release if necessary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --title "Release ${TAG}" \
              --notes "Created by GitHub Actions"
          fi

      - name: Upload file to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILE_NAME: ${{ inputs.file_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          FILE_PATH="${GITHUB_WORKSPACE}/${FILE_NAME}"

          test -f "$FILE_PATH"
          ls -lh "$FILE_PATH"

          gh release upload "$TAG" "$FILE_PATH" \
            --repo "$REPOSITORY" \
            --clobber
